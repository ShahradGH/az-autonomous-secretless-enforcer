<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#0f1b38"/>
    </linearGradient>
    <marker id="c08" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="g08" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
    <marker id="r08" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f87171"/></marker>
    <marker id="a08" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg08)"/>
  <text x="64" y="68" fill="#f8fafc" font-size="32" font-weight="700">AUTONOMOUS SECRETLESS ENFORCER: ENTRA WORKLOAD IDENTITY &amp; ZERO-KEY TOPOLOGY</text>
  <text x="64" y="102" fill="#94a3b8" font-size="18">AuditLogs Hunt -&gt; AI Blast-Radius Classifier -&gt; OIDC PR Diff -&gt; Graph v2.x /removePassword &amp; allowSharedKeyAccess=false</text>

  <!-- Left: Entra ID & Azure Monitor Plane -->
  <rect x="64" y="145" width="420" height="840" rx="16" fill="#0d1936" stroke="#38bdf8" stroke-width="2"/>
  <text x="90" y="185" fill="#38bdf8" font-size="20" font-weight="700">ENTRA ID &amp; AUDIT PLANE</text>
  <text x="90" y="212" fill="#94a3b8" font-size="14">Zero-Trust Non-Human Identity Boundary</text>

  <rect x="90" y="245" width="368" height="185" rx="10" fill="#1e293b" stroke="#f87171"/>
  <text x="110" y="278" fill="#fca5a5" font-size="17" font-weight="700">Entra AuditLogs Secret Hunt</text>
  <text x="110" y="306" fill="#cbd5e1" font-size="14">queries/Entra-SecretAddition-Hunt.kql</text>
  <text x="110" y="334" fill="#cbd5e1" font-size="14">Monitors: Add service principal credentials</text>
  <text x="110" y="360" fill="#cbd5e1" font-size="14">Filter: ModifiedProps has PasswordCredential</text>
  <text x="110" y="395" fill="#f87171" font-size="13" font-weight="700">Trigger: REVOKE_STATIC_SECRET (&lt;60s)</text>

  <rect x="90" y="465" width="368" height="215" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="110" y="498" fill="#6ee7b7" font-size="17" font-weight="700">Microsoft Graph v2.x Control Plane</text>
  <text x="110" y="528" fill="#cbd5e1" font-size="14">POST /applications/{id}/removePassword</text>
  <text x="110" y="556" fill="#cbd5e1" font-size="14">POST /applications/{id}/federatedIdentityCredentials</text>
  <text x="110" y="592" fill="#94a3b8" font-size="13">Issuer: token.actions.githubusercontent.com</text>
  <text x="110" y="618" fill="#94a3b8" font-size="13">Audience: api://AzureADTokenExchange</text>
  <text x="110" y="650" fill="#34d399" font-size="13" font-weight="600">No Bicep / No Terraform / Pure PowerShell 7.4+</text>

  <rect x="90" y="715" width="368" height="230" rx="10" fill="#1e293b" stroke="#fbbf24"/>
  <text x="110" y="748" fill="#fbbf24" font-size="17" font-weight="700">Break-Glass Governance Guard</text>
  <text x="110" y="778" fill="#cbd5e1" font-size="14">Audited exemption list ($BreakGlassExemptAppIds)</text>
  <text x="110" y="806" fill="#cbd5e1" font-size="14">Requires CISO 30-day TTL + CA Workload IP lock</text>
  <text x="110" y="834" fill="#cbd5e1" font-size="14">Egress pinned to 198.51.100.0/24</text>
  <text x="110" y="870" fill="#fde68a" font-size="13" font-weight="600">Action: EXEMPT_BREAK_GLASS_AUDITED</text>

  <!-- Center: AI Blast-Radius & Enforcement Engine -->
  <rect x="530" y="145" width="820" height="840" rx="16" fill="#0d1936" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="10,6"/>
  <text x="560" y="185" fill="#c4b5fd" font-size="20" font-weight="700">AUTONOMOUS ENFORCEMENT &amp; AI CLASSIFIER ENGINE</text>
  <text x="560" y="212" fill="#94a3b8" font-size="14">UK South Private Compute | Deterministic Rubrics + Scoped OIDC PR Generation</text>

  <rect x="560" y="245" width="760" height="245" rx="12" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
  <text x="585" y="280" fill="#e9d5ff" font-size="19" font-weight="700">1. AI Secret Risk &amp; Blast-Radius Classifier</text>
  <text x="585" y="308" fill="#cbd5e1" font-size="14">ai/Invoke-SecretRiskClassifier.ps1 + ai/secret-risk-rubric.json</text>
  <text x="585" y="342" fill="#cbd5e1" font-size="14">• Scores Graph Scopes: Directory.ReadWrite.All (+50), Application.ReadWrite.All (+45)</text>
  <text x="585" y="370" fill="#cbd5e1" font-size="14">• Scores Azure RBAC: Owner (+50), User Access Admin (+45), Contributor (+35)</text>
  <text x="585" y="398" fill="#cbd5e1" font-size="14">• Scores Posture: SecretAge &gt;90d (+15), Missing OIDC (+10)</text>
  <text x="585" y="438" fill="#f87171" font-size="15" font-weight="700">Tier &gt;= 75: CRITICAL_PRIVILEGED_SPN -&gt; IMMEDIATE_REVOKE_AND_OIDC_PR</text>

  <rect x="560" y="525" width="760" height="215" rx="12" fill="#0f2922" stroke="#34d399" stroke-width="2"/>
  <text x="585" y="560" fill="#6ee7b7" font-size="19" font-weight="700">2. Deterministic Secretless Enforcer</text>
  <text x="585" y="588" fill="#cbd5e1" font-size="14">src/Invoke-EntraSecretlessEnforcement.ps1 (-ExecuteGraphRevocation)</text>
  <text x="585" y="622" fill="#cbd5e1" font-size="14">• Checks BreakGlassExemptAppIds before touching credentials</text>
  <text x="585" y="650" fill="#cbd5e1" font-size="14">• Enumerates PasswordCredentials and removes each keyId via Graph v2.x</text>
  <text x="585" y="688" fill="#34d399" font-size="15" font-weight="700">Verdict: REVOKE_STATIC_SECRET_ENFORCE_OIDC | COMPLIANT_SECRETLESS_WORKLOAD</text>

  <rect x="560" y="775" width="760" height="175" rx="12" fill="#132347" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="585" y="810" fill="#fbbf24" font-size="18" font-weight="700">3. Azure Resource Manager Zero-Key Hardening (Invoke-AzRestMethod)</text>
  <text x="585" y="842" fill="#cbd5e1" font-size="14">graph/Deploy-EntraSecretlessWatchdog.ps1</text>
  <text x="585" y="870" fill="#cbd5e1" font-size="14">PATCH /providers/Microsoft.Storage/storageAccounts/{name}?api-version=2023-05-01</text>
  <text x="585" y="904" fill="#34d399" font-size="14" font-weight="700">allowSharedKeyAccess = false | minimumTlsVersion = TLS1_2 | supportsHttpsTrafficOnly = true</text>

  <!-- Right: GitHub Actions & Target Workloads -->
  <rect x="1396" y="145" width="460" height="840" rx="16" fill="#0d1936" stroke="#34d399" stroke-width="2"/>
  <text x="1422" y="185" fill="#34d399" font-size="20" font-weight="700">WORKLOADS &amp; CI/CD REPOS</text>
  <text x="1422" y="212" fill="#94a3b8" font-size="14">Secretless OIDC Target State</text>

  <rect x="1422" y="250" width="408" height="310" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="1442" y="284" fill="#e9d5ff" font-size="17" font-weight="700">Automated OIDC Migration PR Diff</text>
  <text x="1442" y="314" fill="#f87171" font-size="13">- creds: ${{ secrets.AZURE_SPN_CREDENTIALS }}</text>
  <text x="1442" y="344" fill="#34d399" font-size="13">+ permissions: { id-token: write }</text>
  <text x="1442" y="370" fill="#34d399" font-size="13">+ client-id: &lt;AppId&gt;</text>
  <text x="1442" y="396" fill="#34d399" font-size="13">+ tenant-id: ${{ vars.AZURE_TENANT_ID }}</text>
  <text x="1442" y="422" fill="#34d399" font-size="13">+ subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}</text>
  <text x="1442" y="470" fill="#94a3b8" font-size="13">Zero static JSON secrets stored in GitHub</text>

  <rect x="1422" y="600" width="408" height="240" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="1442" y="634" fill="#93c5fd" font-size="17" font-weight="700">Hardened Azure Storage &amp; AKS</text>
  <text x="1442" y="664" fill="#cbd5e1" font-size="14">• Shared Key Auth Disabled (RBAC Only)</text>
  <text x="1442" y="694" fill="#cbd5e1" font-size="14">• SAS Token Generation Blocked</text>
  <text x="1442" y="724" fill="#cbd5e1" font-size="14">• Short-lived OIDC JWTs (10m TTL)</text>
  <text x="1442" y="770" fill="#34d399" font-size="14" font-weight="700">100% Secretless Production Posture</text>

  <!-- Arrows -->
  <path d="M 458 335 L 554 335" stroke="#f87171" stroke-width="2.5" marker-end="url(#r08)" fill="none"/>
  <path d="M 940 490 L 940 520" stroke="#34d399" stroke-width="2.5" marker-end="url(#g08)" fill="none"/>
  <path d="M 558 630 L 464 570" stroke="#34d399" stroke-width="2.5" marker-end="url(#g08)" fill="none"/>
  <path d="M 1320 365 L 1416 365" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#c08)" fill="none"/>
  <path d="M 1320 860 L 1416 720" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#a08)" fill="none"/>
</svg>
